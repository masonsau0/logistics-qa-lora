name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps
        # Lean install - the real model needs torch+transformers+peft+bnb (several GB
        # and a GPU). CI exercises the FastAPI server, request validation, and the
        # metrics (token_f1, keyword_em) via the mock backend, all of which run CPU-only.
        # datasets is needed because src/dataset.py imports it at module level (which
        # transitively gets pulled in by test_server.py importing src.evaluate).
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio ruff \
            fastapi pydantic httpx \
            uvicorn[standard] sse-starlette \
            anthropic python-dotenv \
            datasets

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        env:
          USE_MOCK: "true"
        run: pytest -v tests/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
